# /etc/nginx/sites-available/neon — актуальная конфигурация с сервера (после certbot).
# Основной домен неон-графикс.рф (punycode); www, http и IP перенаправляются на него.
# Файлы из public отдаёт nginx напрямую, остальное — Next на 3000.

# /etc/nginx/sites-available/neon — проксирует домен на Next.js (порт 3000).
# TLS добавляет certbot --nginx, он же дописывает редирект с http.
server {
    server_name xn----8sbigsmpbixo7a.xn--p1ai 84.54.30.209;

    client_max_body_size 25m;

    # Собранная статика Next — отдаём с долгим кэшем
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Файлы из public (фото, логотипы, OG) отдаёт nginx напрямую: Next после
    # сборки новые файлы не видит, а админка дописывает их на диск на лету.
    location / {
        root /var/www/neon/public;
        try_files $uri @next;
    }

    location ~* \.(webp|jpg|jpeg|png|svg|ico|gif|woff2?)$ {
        root /var/www/neon/public;
        try_files $uri @next;
        add_header Cache-Control "public, max-age=604800";
    }

    location @next {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xn----8sbigsmpbixo7a.xn--p1ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xn----8sbigsmpbixo7a.xn--p1ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = www.xn----8sbigsmpbixo7a.xn--p1ai) {
        return 301 https://xn----8sbigsmpbixo7a.xn--p1ai$request_uri;
    } # managed by Certbot


    if ($host = xn----8sbigsmpbixo7a.xn--p1ai) {
        return 301 https://xn----8sbigsmpbixo7a.xn--p1ai$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name xn----8sbigsmpbixo7a.xn--p1ai www.xn----8sbigsmpbixo7a.xn--p1ai 84.54.30.209;
    return 301 https://xn----8sbigsmpbixo7a.xn--p1ai$request_uri;




}
# www -> основной домен (https)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.xn----8sbigsmpbixo7a.xn--p1ai;
    ssl_certificate /etc/letsencrypt/live/xn----8sbigsmpbixo7a.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----8sbigsmpbixo7a.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://xn----8sbigsmpbixo7a.xn--p1ai$request_uri;
}
