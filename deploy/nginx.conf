# /etc/nginx/sites-available/neon — проксирует домен на Next.js (порт 3000).
# TLS добавляет certbot --nginx, он же дописывает редирект с http.
server {
    listen 80;
    listen [::]:80;
    server_name xn----8sbigsmpbixo7a.xn--p1ai www.xn----8sbigsmpbixo7a.xn--p1ai 84.54.30.209;

    client_max_body_size 25m;

    # Собранная статика Next — отдаём с долгим кэшем
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
